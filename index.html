<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>묵주기도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#141a30;
    --blue:#1c2445;
    --blue-panel:#232c55;
    --gold:#e8c15a;
    --gold-bright:#f6d98a;
    --rose:#d98a9a;
    --ink-dim:#5a6488;
    --ink-mid:#98a2c8;
    --line:#2e3763;
  }
  body.light{
    --blue-deep:#faf5ea;
    --blue:#f4ecdb;
    --blue-panel:#fffdf7;
    --gold:#b8892f;
    --gold-bright:#d4a63c;
    --rose:#c76a80;
    --ink-dim:#b3a88f;
    --ink-mid:#6e6450;
    --line:#e6dcc5;
  }
  body.light{
    background:linear-gradient(180deg,#fdf9f0 0%,#faf5ea 45%,#f3ead6 100%) !important;
  }
  body.light #prayer{color:#4a4234;}
  body.light #panel{background:rgba(252,248,238,.8);}
  body.light #main{background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(184,137,47,.07),transparent 70%);}
  body.light header h1{
    background:linear-gradient(180deg,#c99b35 20%,#a37a24 75%,#8a6318);
    -webkit-background-clip:text;background-clip:text;
    text-shadow:0 0 22px rgba(184,137,47,.15);
  }
  body.light #calOverlay, body.light #nvOverlay, body.light #voiceOverlay{
    background:rgba(245,238,225,.96);
  }
  body.light #toast{background:var(--blue-panel);}
  body.light #prayer.karaoke .ch.done{text-shadow:0 0 10px rgba(184,137,47,.2);}
  body.light #prayer.karaoke .ch.cur{color:#8a6318;text-shadow:0 0 12px rgba(184,137,47,.35);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{
    position:fixed;inset:0;width:100%;
    background:linear-gradient(180deg,#181f3a 0%,var(--blue-deep) 45%,#0e1226 100%);
    color:var(--ink-mid);
    font-family:'Gowun Batang','Noto Serif KR',serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  header{
    padding:14px 16px 13px;text-align:center;
    background:transparent;flex:0 0 auto;position:relative;
  }
  header::after{
    content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:150px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.55;
  }
  header h1{
    font-family:'Noto Serif KR',serif;font-weight:700;
    font-size:1.5rem;letter-spacing:.42em;text-indent:.42em;
    color:var(--gold-bright);
    background:linear-gradient(180deg,#f8e3a8 20%,var(--gold) 75%,#c9a144);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 24px rgba(232,193,90,.22);
    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  header h1::before, header h1::after{
    content:'';flex:0 0 34px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold));
    opacity:.7;letter-spacing:0;text-indent:0;
  }
  header h1::after{
    background:linear-gradient(90deg,var(--gold),transparent);
  }
  #mysteryName::before{content:'🌹 ';font-size:.7rem;}
  #mysteryName{font-size:.82rem;color:var(--rose);letter-spacing:.2em;margin-top:7px;}
  #dateLine{font-size:.7rem;color:var(--ink-dim);letter-spacing:.1em;margin-top:3px;}
  #goalLine{font-size:.72rem;color:var(--gold);letter-spacing:.08em;margin-top:4px;line-height:1.6;}
  #goalLine .nv{color:var(--rose);}
  input[type=number],input[type=date],#nvTitle{
    font-family:inherit;background:var(--blue-panel);color:var(--ink-mid);
    border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;
  }
  input[type=number]{width:56px;text-align:center;}

  /* ── 지향 기도 설정 ── */
  #nvOverlay{
    position:fixed;inset:0;background:rgba(12,15,30,.94);
    display:none;flex-direction:column;align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;z-index:30;
  }
  #nvOverlay.open{display:flex;}
  #nvCard{width:100%;max-width:440px;}
  #nvCard h2{font-family:'Noto Serif KR',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.2em;text-align:center;margin-bottom:14px;}
  .nvrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .nvrow label{font-size:.8rem;color:var(--ink-dim);min-width:64px;}
  #nvTitle{flex:1;min-width:200px;}
  #nvStatus{font-size:.78rem;color:var(--ink-mid);line-height:1.8;margin:10px 0;text-align:center;}
  #nvStatus b{color:var(--rose);}
  .day.nv{box-shadow:inset 0 -2px 0 var(--ink-dim);}
  .day.nv.nvmet{box-shadow:inset 0 -2px 0 var(--rose);}
  #rangeBox{
    margin-top:14px;background:var(--blue);
    border:1px solid var(--line);border-radius:12px;padding:12px;
  }
  #rangeBox .nvrow{margin-bottom:8px;}
  #rgResult{font-size:.8rem;color:var(--ink-mid);text-align:center;line-height:1.9;}
  #rgResult b{color:var(--gold);}

  /* ── 기도 화면 ── */
  #main{
    flex:1 1 auto;overflow-y:auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 6vw;text-align:center;
    background:radial-gradient(ellipse 70% 45% at 50% 42%,rgba(232,193,90,.05),transparent 70%);
  }
  #stepTitle{
    font-family:'Noto Serif KR',serif;
    color:var(--gold);font-size:1rem;letter-spacing:.3em;text-indent:.3em;
    margin-bottom:6px;
  }
  #stepTitle:not(:empty)::before{
    content:'✛';display:block;
    color:var(--rose);font-size:.75rem;letter-spacing:0;text-indent:0;
    margin-bottom:10px;opacity:.75;
  }
  #stepSub{font-size:.78rem;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:18px;}
  #beads{display:flex;gap:9px;justify-content:center;margin-bottom:20px;min-height:14px;flex-wrap:wrap;}
  #beads .bd{
    width:14px;height:14px;border-radius:50%;
    border:1px solid rgba(90,100,136,.6);
    background:radial-gradient(circle at 35% 30%,rgba(152,162,200,.15),transparent 60%);
    transition:all .25s;
  }
  #beads .bd.on{
    background:radial-gradient(circle at 35% 30%,#fbe9b8,var(--gold) 70%);
    border-color:var(--gold);
    box-shadow:0 0 9px rgba(232,193,90,.45), inset 0 -1px 2px rgba(0,0,0,.25);
  }
  #beads .bd.now{
    background:radial-gradient(circle at 35% 30%,#f3c4cf,var(--rose) 70%);
    border-color:var(--rose);
    box-shadow:0 0 11px rgba(217,138,154,.55), inset 0 -1px 2px rgba(0,0,0,.25);
  }
  #prayer{
    max-width:600px;
    font-size:var(--fs,1.5rem);
    line-height:1.95;letter-spacing:.03em;word-break:keep-all;
    color:#c9d1ee;
  }
  #prayer .amen{color:var(--gold);}
  #prayer .rubric{color:var(--ink-dim);font-size:.8em;}
  .vtext .rubric{color:var(--ink-dim);font-size:.85em;}
  #prayer .ch{transition:color .1s linear;}
  #prayer.karaoke .ch{color:var(--ink-dim);}
  #prayer.karaoke .ch.done{color:var(--gold);text-shadow:0 0 12px rgba(232,193,90,.3);}
  #prayer.karaoke .ch.cur{color:var(--gold-bright);text-shadow:0 0 16px rgba(246,217,138,.55);}

  /* ── 하단 ── */
  #panel{
    flex:0 0 auto;background:rgba(28,36,69,.65);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  }
  #bar{
    width:100%;max-width:680px;margin:0 auto 9px;
    height:3px;background:var(--line);border-radius:2px;
  }
  #barFill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold-bright));border-radius:2px;transition:width .3s;}
  .row{display:flex;gap:8px;max-width:680px;margin:0 auto;justify-content:center;align-items:center;flex-wrap:wrap;}
  .row+.row{margin-top:7px;}
  button{
    font-family:inherit;background:transparent;color:var(--ink-mid);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 15px;font-size:.85rem;cursor:pointer;letter-spacing:.06em;
  }
  button.auto{
    min-width:150px;font-weight:600;
    border-color:var(--gold);color:var(--gold);
  }
  button.auto.playing{
    background:rgba(232,193,90,.12);
  }
  button.primary{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241c05;border-color:var(--gold);
    font-weight:700;flex:1;max-width:300px;padding:10px 0;font-size:.98rem;
    box-shadow:0 2px 10px rgba(232,193,90,.25);
  }
  button:disabled{opacity:.35;}
  label.small{font-size:.75rem;color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  #more{
    display:none;
    position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:var(--blue-panel);
    border-top:1px solid var(--gold);
    border-radius:16px 16px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.55);
    max-height:70%;overflow-y:auto;
  }
  #more.open{display:block;}
  #more .close{width:100%;max-width:680px;display:block;margin:6px auto 0;}
  input[type=range]{accent-color:var(--gold);width:110px;}
  select{
    font-family:inherit;background:var(--blue-panel);color:var(--ink-mid);
    border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;
  }

  /* ── 달력 ── */
  #calOverlay{
    position:fixed;inset:0;background:rgba(12,15,30,.94);
    display:none;flex-direction:column;align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;z-index:30;
  }
  #calOverlay.open{display:flex;}
  #calCard{width:100%;max-width:420px;}
  #calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  #calHead h2{font-family:'Noto Serif KR',serif;color:var(--gold);font-size:1.05rem;letter-spacing:.15em;}
  #calHead button{padding:8px 14px;}
  #calGrid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    background:var(--blue);border:1px solid var(--line);border-radius:12px;padding:12px 8px;
  }
  .dow{font-size:.7rem;color:var(--ink-dim);text-align:center;padding:4px 0;}
  .dow.sun{color:var(--rose);}
  .day{
    aspect-ratio:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    font-size:.82rem;color:var(--ink-mid);border-radius:8px;
  }
  .day.out{opacity:.22;}
  .day.today{outline:1px solid var(--gold);}
  .day .mark{
    min-width:15px;height:15px;border-radius:50%;
    font-size:.62rem;line-height:15px;text-align:center;
    color:transparent;background:transparent;
  }
  .day.done{color:var(--gold-bright);}
  .day.done .mark{
    background:var(--rose);color:#2a1220;font-weight:700;
    box-shadow:0 0 8px rgba(217,138,154,.7);
  }
  #calStats{text-align:center;font-size:.8rem;color:var(--ink-dim);margin-top:14px;line-height:1.8;}
  #calStats b{color:var(--gold);}
  #calEdit{
    display:none;margin-top:14px;
    background:var(--blue);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;
    align-items:center;justify-content:center;gap:14px;
  }
  #calEdit.open{display:flex;}
  #calEdit span{font-size:.85rem;color:var(--ink-mid);}
  #calEdit b{color:var(--gold);font-size:1.05rem;min-width:52px;}
  #calEdit button{padding:6px 16px;font-size:1rem;}
  .day{cursor:pointer;}
  .day.sel{background:var(--blue-panel);outline:1px solid var(--rose);}
  #toast{
    position:fixed;left:50%;bottom:130px;transform:translateX(-50%);
    background:var(--blue-panel);border:1px solid var(--gold);color:var(--gold-bright);
    padding:10px 20px;border-radius:24px;font-size:.9rem;letter-spacing:.05em;
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;white-space:nowrap;
  }
  #toast.show{opacity:1;}

  /* ── 목소리 녹음 ── */
  #voiceOverlay{
    position:fixed;inset:0;background:rgba(12,15,30,.94);
    display:none;flex-direction:column;align-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;z-index:30;
  }
  #voiceOverlay.open{display:flex;}
  #voiceCard{width:100%;max-width:460px;}
  #voiceCard h2{
    font-family:'Noto Serif KR',serif;color:var(--gold);
    font-size:1.05rem;letter-spacing:.2em;text-align:center;margin-bottom:6px;
  }
  #voiceCard p.hint{font-size:.72rem;color:var(--ink-dim);text-align:center;margin-bottom:16px;line-height:1.7;}
  .vitem{
    background:var(--blue);border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;overflow:hidden;
  }
  .vitem.recing{border-color:var(--rose);}
  .vrow{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;
  }
  .vrow .nm{flex:1;font-size:.9rem;color:var(--ink-mid);cursor:pointer;}
  .vrow .nm .dot{color:var(--ink-dim);margin-right:6px;}
  .vitem.has .nm .dot{color:var(--rose);}
  .vrow button{padding:6px 11px;font-size:.78rem;}
  .vrow button.recing{background:var(--rose);color:#2a1220;border-color:var(--rose);font-weight:700;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  .vtext{
    display:none;
    padding:4px 16px 16px;
    font-size:1.05rem;line-height:1.95;letter-spacing:.03em;
    color:#c9d1ee;word-break:keep-all;
    border-top:1px dashed var(--line);
    padding-top:12px;margin:0 12px 12px;
  }
  .vtext .amen{color:var(--gold);}
  .vitem.open .vtext{display:block;}
  #voiceClose{margin-top:14px;width:100%;max-width:460px;}
  #calClose{margin-top:18px;width:100%;max-width:420px;}

  /* ── 완료 화면 ── */
  #doneMsg{display:none;}
  #doneMsg.show{display:block;}
  #doneMsg .big{font-size:1.6rem;color:var(--gold);letter-spacing:.2em;margin-bottom:14px;font-family:'Noto Serif KR',serif;}

  @media (max-width:480px){
    #prayer{font-size:calc(var(--fs,1.5rem) * .9);}
  }
</style>
</head>
<body>

<header>
  <h1>묵 주 기 도</h1>
  <div id="mysteryName"></div>
  <div id="dateLine"></div>
  <div id="goalLine"></div>
</header>

<div id="main">
  <div id="stepTitle"></div>
  <div id="stepSub"></div>
  <div id="beads"></div>
  <div id="prayer"></div>
  <div id="doneMsg">
    <div class="big">기도를 마쳤습니다</div>
    <p id="doneText"></p>
    <div class="row" style="margin-top:20px;">
      <button id="btnNextMyst" class="primary">다음 신비 이어가기</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="bar"><div id="barFill"></div></div>
  <div class="row">
    <button id="btnPrev">이전</button>
    <button id="btnNext" class="primary">다음 ›</button>
    <button id="btnMore">설정 ⚙</button>
  </div>
  <div class="row">
    <button id="btnAuto" class="auto">▶ 자동 읽기</button>
    <label class="small">속도
      <input type="range" id="kSpeed" min="1.5" max="7" step="0.5" value="3.5">
    </label>
    <button id="btnCont">∞ 멈춤없이</button>
  </div>
  <div class="row">
    <button id="btnDone">🌹 1단 봉헌</button>
    <button id="btnEnd">🙏 기도 끝내기</button>
    <button id="btnCal">달력</button>
  </div>
</div>

<div id="more">
  <div class="row">
    <label class="small">읽어 주기
      <select id="readSel">
        <option value="none">글자만 (음성 없음)</option>
        <option value="rec">내 녹음</option>
        <option value="tts">기계 음성 (TTS)</option>
      </select>
    </label>
    <button id="btnVoiceRec">녹음</button>
    <button id="btnNovena">기도 지향</button>
  </div>
  <div class="row">
    <label class="small">봉헌
      <select id="modeSel">
        <option value="manual">수동(직접 체크)</option>
        <option value="auto">자동(단마다 +1)</option>
      </select>
    </label>
    <label class="small">오늘 목표 <input type="number" id="goalInput" min="0" max="99" value="0"> 단</label>
    <label class="small">꽃다발 봉헌
      <select id="spiritSel">
        <option value="pet">청원기도</option>
        <option value="thx">감사기도</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label class="small">신비 선택
      <select id="mysterySel">
        <option value="auto">오늘의 신비(자동)</option>
        <option value="joyful">환희의 신비</option>
        <option value="luminous">빛의 신비</option>
        <option value="sorrowful">고통의 신비</option>
        <option value="glorious">영광의 신비</option>
      </select>
    </label>
    <label class="small">글자 크기
      <input type="range" id="fontSize" min="1.1" max="2.4" step="0.1" value="1.5">
    </label>
    <label class="small">테마
      <select id="themeSel">
        <option value="night">은은한 밤</option>
        <option value="light">화사한 낮</option>
      </select>
    </label>
    <button id="btnRestart">처음부터</button>
  </div>
  <button class="close" id="moreClose">닫기</button>
</div>

<div id="calOverlay">
  <div id="calCard">
    <div id="calHead">
      <button id="calPrev">‹</button>
      <h2 id="calTitle"></h2>
      <button id="calNext">›</button>
    </div>
    <div id="calGrid"></div>
    <div id="calStats"></div>
    <div id="calEdit">
      <span id="calEditDate"></span>
      <button id="calMinus">−</button>
      <b id="calEditCnt">0단</b>
      <button id="calPlus">＋</button>
    </div>
    <div id="rangeBox">
      <div class="nvrow" style="justify-content:center;">
        <input type="date" id="rgFrom"> ~ <input type="date" id="rgTo">
      </div>
      <div id="rgResult"></div>
    </div>
  </div>
  <button id="calClose">닫기</button>
</div>

<div id="voiceOverlay">
  <div id="voiceCard">
    <h2>내 목소리 녹음</h2>
    <p class="hint">기도문을 하나씩 또박또박 읽어 녹음해 주세요.<br>기도할 때 [내 목소리]를 켜면 녹음이 함께 재생됩니다.<br>● 녹음이 안 되는 환경에서는, 휴대폰 녹음 앱으로 녹음한 뒤 📁 버튼으로 파일을 불러오세요.</p>
    <div id="voiceList"></div>
  </div>
  <button id="voiceClose">닫기</button>
</div>

<div id="nvOverlay">
  <div id="nvCard">
    <h2>기도 지향</h2>
    <div class="nvrow"><label>지향</label><input type="text" id="nvTitle" placeholder="예) 가족의 건강을 위하여"></div>
    <div class="nvrow"><label>형식</label>
      <select id="nvPreset">
        <option value="9">9일기도</option>
        <option value="54">54일기도</option>
        <option value="0">직접 입력</option>
      </select>
      <input type="number" id="nvDays" min="1" max="365" value="9"> 일간
    </div>
    <div class="nvrow"><label>시작일</label><input type="date" id="nvStart"></div>
    <div class="nvrow"><label>하루</label><input type="number" id="nvPerDay" min="1" max="99" value="1"> 단 이상</div>
    <div id="nvStatus"></div>
    <div class="row">
      <button id="nvSave" class="primary">저장</button>
      <button id="nvClear">지향 해제</button>
      <button id="nvClose">닫기</button>
    </div>
  </div>
</div>

<input type="file" id="voiceFile" accept="audio/*" hidden>
<div id="toast"></div>

<script>
/* ═══ 기도문 ═══ */
const P = {

function buildSteps(){
  const M=MYST[mystKey];
  steps=[]; counted=new Set();
  steps.push({p:P.sign});
  steps.push({p:P.creed});
  steps.push({p:P.lord});
  for(let i=1;i<=3;i++) steps.push({p:P.hail, bead:i, of:3, sub:'성모송 '+i+' / 3'});
  steps.push({p:P.glory});
  for(let d=0; d<5; d++){
    steps.push({p:{t:'제'+(d+1)+'단 묵상', x:M.m[d]}, sub:M.name+' 제'+(d+1)+'단', med:true});
    steps.push({p:P.lord, sub:M.name+' 제'+(d+1)+'단'});
    for(let i=1;i<=10;i++)
      steps.push({p:P.hail, bead:i, of:10, sub:M.name+' 제'+(d+1)+'단 · 성모송 '+i+' / 10'});
    steps.push({p:P.glory, sub:M.name+' 제'+(d+1)+'단'});
    steps.push({p:P.fatima, sub:M.name+' 제'+(d+1)+'단', dEnd:true, dNo:d});
  }
  steps.push({p:P.spirit});
  steps.push({p: settings.spirit==='thx' ? P.spiritT : P.spiritP});
  steps.push({p:P.salve});
  steps.push({p:P.salveOra});
  steps.push({p:P.sign});
}

const voices={};          /* {id: dataURL} */
const voiceAudio=new Audio();
let voiceOn=false, voicePlaying=false;
let mediaRec=null, recChunks=[], recId=null, openText=null, voiceFileTarget=null;

$('voiceFile').onchange=e=>{
  const f=e.target.files[0], k=voiceFileTarget;
  e.target.value='';
  if(!f||!k) return;
  if(f.size>4*1024*1024){
    alert('파일이 너무 큽니다(4MB 이하 권장).\n기도문 하나씩 짧게 녹음해 주세요.');
    return;
  }
  const r=new FileReader();
  r.onload=async()=>{
    voices[k]=r.result;
    const ok=await kvSet('rosary-voice-'+k, r.result);
    if(!ok) toast('저장 공간이 부족해 이번만 사용됩니다');
    drawVoiceList();
    toast(P[k].t+' 녹음을 연결했습니다');
  };
  r.readAsDataURL(f);
};

async function loadVoices(){
  for(const k in P){
    const v=await kvGet('rosary-voice-'+k);
    if(v && v.length>50) voices[k]=v;
  }
}
function drawVoiceList(){
  const box=$('voiceList'); box.innerHTML='';
  for(const k in P){
    const item=document.createElement('div');
    item.className='vitem'
      +(voices[k]?' has':'')
      +(recId===k?' recing open':'')
      +(openText===k?' open':'');
    const row=document.createElement('div');
    row.className='vrow';
    const nm=document.createElement('span');
    nm.className='nm';
    nm.innerHTML='<span class="dot">●</span>'+P[k].t+' <small style="color:var(--ink-dim)">▾</small>';
    nm.onclick=()=>{ openText = openText===k ? null : k; drawVoiceList(); };
    const bRec=document.createElement('button');
    bRec.textContent = recId===k ? '■ 정지' : '● 녹음';
    if(recId===k) bRec.classList.add('recing');
    bRec.onclick=()=>toggleRec(k);
    const bFile=document.createElement('button');
    bFile.textContent='📁';
    bFile.title='녹음 파일 불러오기';
    bFile.onclick=()=>{ voiceFileTarget=k; $('voiceFile').click(); };
    const bPlay=document.createElement('button');
    bPlay.textContent='▶'; bPlay.disabled=!voices[k];
    bPlay.onclick=()=>{ voiceAudio.src=voices[k]; voiceAudio.play(); };
    const bDel=document.createElement('button');
    bDel.textContent='지움'; bDel.disabled=!voices[k];
    bDel.onclick=async()=>{ delete voices[k]; try{ if(window.storage) await window.storage.delete('rosary-voice-'+k); }catch(e){} try{ localStorage.removeItem('rosary-voice-'+k); }catch(e){} drawVoiceList(); };
    row.append(nm,bRec,bFile,bPlay,bDel);
    const txt=document.createElement('div');
    txt.className='vtext';
    txt.innerHTML=P[k].x;
    item.append(row,txt);
    box.appendChild(item);
  }
}
async function toggleRec(k){
  if(recId===k){ mediaRec.stop(); return; }
  if(recId){ mediaRec.stop(); }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[]; recId=k;
    mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>recChunks.push(e.data);
    mediaRec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      const r=new FileReader();
      r.onload=async()=>{
        voices[k]=r.result;
        const ok=await kvSet('rosary-voice-'+k, r.result);
        if(!ok) toast('저장 공간이 부족해 이번만 사용됩니다');
        recId=null; drawVoiceList();
        toast(P[k].t+' 녹음을 저장했습니다');
      };
      r.readAsDataURL(blob);
    };
    mediaRec.start();
    openText=k;
    drawVoiceList();
    const items=document.querySelectorAll('.vitem.recing');
    if(items[0]) items[0].scrollIntoView({block:'center',behavior:'smooth'});
  }catch(err){
    alert('마이크를 사용할 수 없습니다.\n브라우저의 마이크 권한을 허용해 주세요.\n(일부 환경에서는 서버에 올린 뒤에만 녹음이 가능합니다.)');
    recId=null; drawVoiceList();
  }
}

function renderPrayer(html){
  const pr=$('prayer');
  pr.classList.toggle('karaoke',kOn);
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  pr.innerHTML=''; kChars=[]; kProg=0; kHold=0;
  (function walk(node,cls){
    node.childNodes.forEach(ch=>{
      if(ch.nodeType===3){
        for(const c of ch.textContent){
          const s=document.createElement('span');
          s.textContent=c;
          s.className='ch'+(cls?' '+cls:'');
          pr.appendChild(s);
          if(c.trim() && cls!=='rubric') kChars.push(s);
        }
      }else{
        let c2=cls;
        if(ch.classList?.contains('amen')) c2='amen';
        if(ch.classList?.contains('rubric')) c2='rubric';
        walk(ch,c2);
      }
    });
  })(tmp,'');
}

    speakStep();
  }else if(kOn && voiceOn && pid && voices[pid]){
    voiceAudio.src=voices[pid];
    voiceAudio.play().then(()=>{ voicePlaying=true; }).catch(()=>{});
    voicePlaying=true;
  }
  saveBM();
}

function advance(){
  const s=steps[idx];
  idx++;
  if(s && s.dEnd && !counted.has(s.dNo)){
    counted.add(s.dNo);

}

/* ═══ 따라 읽기(글자 색칠) ═══ */
function kTick(ts){
  if(idx<steps.length && kChars.length && (kOn || voicePlaying || ttsPlaying)){
    if(ttsPlaying){
      /* 경계 이벤트가 오면 실제 발화 위치, 아니면 보정된 시간 추정 */
      const est=Math.min((performance.now()-ttsT0)/ttsEst,1)*kChars.length;
      const p=ttsHasBoundary
        ? Math.min(ttsBoundaryPos/ttsLen,1)*kChars.length
        : est;
      const ci=Math.min(Math.floor(p),kChars.length-1);
      $('prayer').classList.add('karaoke');
      kChars.forEach((c,i)=>{
        c.classList.toggle('done', i<ci || p>=kChars.length);
        c.classList.toggle('cur', i===ci && p<kChars.length);
      });
      kLast=ts;
      requestAnimationFrame(kTick);
      return;
    }
    if(voicePlaying && voiceAudio.duration){
      /* 녹음 길이에 맞춰 색칠 */
      const p=Math.min(voiceAudio.currentTime/voiceAudio.duration,1)*kChars.length;
      const ci=Math.min(Math.floor(p),kChars.length-1);
      $('prayer').classList.add('karaoke');
      kChars.forEach((c,i)=>{
        c.classList.toggle('done', i<ci || p>=kChars.length);
        c.classList.toggle('cur', i===ci && p<kChars.length);
      });
    }else if(kOn && settings.read!=='tts' && kLast){
      if(kProg<kChars.length){
        kProg=Math.min(kProg+(ts-kLast)/1000*kRate, kChars.length);
        const ci=Math.min(Math.floor(kProg),kChars.length-1);
        kChars.forEach((c,i)=>{
          c.classList.toggle('done', i<ci || kProg>=kChars.length);
          c.classList.toggle('cur', i===ci && kProg<kChars.length);
        });
      }else{
        kHold+=(ts-kLast)/1000;
        if(kHold>0.9){ advance(); }
      }
    }
    kLast=ts;
  }else kLast=ts;
  requestAnimationFrame(kTick);
}
requestAnimationFrame(kTick);
let voiceResume=false;
let ttsPlaying=false, ttsRestart=false, ttsT0=0, ttsEst=1;
let ttsHasBoundary=false, ttsBoundaryPos=0, ttsLen=1, ttsRate=1;
function ttsText(x){
  const t=document.createElement('div'); t.innerHTML=x;
  t.querySelectorAll('.rubric').forEach(n=>n.remove());
  return t.textContent||'';
}
function ttsRateFromSlider(){
  /* 슬라이더(1.5~7) → 낭독 속도 0.55~1.5배 */
  return 0.55 + (kRate-1.5)/(7-1.5)*(1.5-0.55);
}
function stopTTS(){
  ttsPlaying=false; ttsRestart=false; ttsHasBoundary=false;
  try{ speechSynthesis.cancel(); }catch(e){}
}
function speakStep(){
  const s=steps[idx]; if(!s || !('speechSynthesis' in window)) return;
  const txt=ttsText(s.p.x); if(!txt.trim()) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='ko-KR';
    ttsRate=ttsRateFromSlider();
    u.rate=ttsRate;
    const myIdx=idx;
    const nonSpace=txt.replace(/\s/g,'');
    ttsLen=Math.max(nonSpace.length,1);
    /* 글자 위치 매핑: 전체 텍스트 인덱스 → 공백 제외 글자 수 */
    const map=new Array(txt.length+1); let c=0;
    for(let i=0;i<txt.length;i++){ map[i]=c; if(txt[i].trim()) c++; }
    map[txt.length]=c;
    ttsHasBoundary=false; ttsBoundaryPos=0;
    u.onboundary=e=>{
      if(idx!==myIdx) return;
      if(typeof e.charIndex==='number' && e.charIndex>=0){
        ttsHasBoundary=true;
        ttsBoundaryPos=map[Math.min(e.charIndex,txt.length)];
      }
    };
    u.onend=()=>{
      if(!ttsPlaying || idx!==myIdx) return;
      /* 실측 속도로 다음 추정을 자기 보정 (경계 이벤트가 없는 기기용) */
      const sec=(performance.now()-ttsT0)/1000;
      if(sec>1 && ttsLen>5){
        const baseCps=ttsLen/sec/ttsRate;
        settings.ttsCps = settings.ttsCps ? settings.ttsCps*0.5+baseCps*0.5 : baseCps;
        saveSettings();
      }
      ttsPlaying=false;
      setTimeout(()=>{ if(kOn && idx===myIdx && idx<steps.length) advance(); },400);
    };
    u.onerror=()=>{ ttsPlaying=false; };
    ttsPlaying=true; ttsT0=performance.now();
    const cps=(settings.ttsCps||3.3)*ttsRate;
    ttsEst=Math.max(ttsLen/cps*1000,1500);
    speechSynthesis.speak(u);
  }catch(e){ ttsPlaying=false; }
}

/* ═══ 저장 ═══ */
async function kvSet(k,v){
  try{ if(window.storage){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  return false;
}
async function kvGet(k){
  try{ if(window.storage){ const r=await window.storage.get(k); if(r&&r.value!=null) return r.value; } }catch(e){}
  try{ return localStorage.getItem(k); }catch(e){}
  return null;
}
let log={};   /* { 'YYYY-MM-DD': 단수 } */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function loadLog(){
  try{
    const v2=await kvGet('rosary-log-v2');
    if(v2){ log=JSON.parse(v2)||{}; return; }
    const v1=await kvGet('rosary-log-v1');   /* 구버전(완료일 목록) 이전 */
    if(v1){ (JSON.parse(v1)||[]).forEach(d=>log[d]=1);
      await kvSet('rosary-log-v2',JSON.stringify(log)); }
  }catch(e){}
}
async function markToday(n=1){
  const t=ymd(new Date());
  const prev=log[t]||0;
  log[t]=prev+n;
  await kvSet('rosary-log-v2',JSON.stringify(log));
  updateGoalLine();
  if(settings.goal>0 && prev<settings.goal && log[t]>=settings.goal)
    toast('🌹 오늘 목표 '+settings.goal+'단을 채우셨습니다!');
  if(novena){

}

      if(di>=0 && di<novena.days) nvCls=' nv'+(cnt>=novena.perDay?' nvmet':'');
    }
    e.className='day'+(cnt>0?' done':'')+(key===today?' today':'')+(key===selDay?' sel':'')+nvCls;
    e.innerHTML='<span>'+d+'</span><span class="mark">'+(cnt>0?cnt:'')+'</span>';
    e.onclick=()=>{ selDay=key; drawCal(); };
    g.appendChild(e);
  }
  /* 연속 일수·누적 */
  let streak=0; const t=new Date();
  for(;;){ const k=ymd(t); if((log[k]||0)>0){ streak++; t.setDate(t.getDate()-1); } else break; }
  let totalDan=0; for(const k in log) totalDan+=log[k];
  $('calStats').innerHTML='이번 달 <b>'+monthDays+'일</b>, <b>'+monthDan+'단</b>'
    +' · 지금까지 모두 <b>'+totalDan+'단</b>을 봉헌하셨습니다.'
    +(streak>0? '<br>오늘까지 <b>'+streak+'일</b> 연속입니다. 🌹':'')
    +(novena? '<br>🕯 '+nvStatusText():'');
  /* 편집기 */
  const ed=$('calEdit');
  if(selDay){
    ed.classList.add('open');
    const[y,m,dd]=selDay.split('-');
    $('calEditDate').textContent=(+m)+'월 '+(+dd)+'일';
    $('calEditCnt').textContent=(log[selDay]||0)+'단';
  }else ed.classList.remove('open');
}
$('btnCal').onclick=()=>{ closeMore(); openCal(); };
$('calClose').onclick=()=>$('calOverlay').classList.remove('open');
$('calPrev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} selDay=null; drawCal(); };
$('calNext').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} selDay=null; drawCal(); };

/* ═══ 시작 ═══ */
(async()=>{
  await loadLog();
  await loadVoices();
  await loadSettings();
  await loadNovena();
  buildSteps(); refreshHead();
  await tryResume();
  updateGoalLine(); show();
})();
</script>
